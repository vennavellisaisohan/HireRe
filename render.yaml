services:
  - type: web
    name: hirere-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HIRERE_USE_EMBEDDINGS
        value: "0"
      - key: CORS_ORIGINS
        value: https://hirere.vercel.app,http://localhost:3456
